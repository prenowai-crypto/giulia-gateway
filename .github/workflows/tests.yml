name: Automated Tests

# Lanciabile manualmente da GitHub UI (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  runner-b:
    name: Integration tests (Realtime API text)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ws dependency
        run: npm install ws --no-save

      - name: Run tests
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/runner-b.cjs

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: tests/reports/

      - name: Commit reports back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/reports/ || true
          git diff --staged --quiet || git commit -m "chore: update test reports [skip ci]"
          git push || true
