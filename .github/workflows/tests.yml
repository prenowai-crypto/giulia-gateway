name: Automated Tests (A + B)

# Lanciabile solo manualmente da GitHub UI (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      levels:
        description: 'Which levels to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - a-only
          - b-only

jobs:
  runner-a:
    name: Level A — Backend unit tests
    runs-on: ubuntu-latest
    if: inputs.levels == 'both' || inputs.levels == 'a-only'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Level A tests
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node tests/runner-a.js

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-a
          path: tests/reports/

      - name: Commit reports back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/reports/ || true
          git diff --staged --quiet || git commit -m "chore: update test reports A [skip ci]"
          git push || true

  runner-b:
    name: Level B — Integration tests (Realtime API text)
    runs-on: ubuntu-latest
    if: inputs.levels == 'both' || inputs.levels == 'b-only'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ws dependency
        run: npm install ws --no-save

      - name: Run Level B tests
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/runner-b.js

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-b
          path: tests/reports/

      - name: Commit reports back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/reports/ || true
          git diff --staged --quiet || git commit -m "chore: update test reports B [skip ci]"
          git push || true
